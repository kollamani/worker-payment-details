# =============================================================================
# Financial Ledger - shared security header snippet (nginx)
# =============================================================================
# Deploy to:  /etc/nginx/snippets/financial-ledger-security-headers.conf
#
# WHY THIS IS A SEPARATE FILE (do not inline it and do not skip the include):
# nginx discards ALL add_header directives inherited from an outer block as soon
# as a nested block declares one of its own. The moment a location sets
# "Cache-Control", the security headers from the server block would silently
# disappear from that response. Include this file in EVERY location that adds a
# header of its own.
#
# Values are the canonical ones from backend/middleware/securityHeaders.js.
# Generate them with:  cd backend && npm run verify:headers -- --print
#
# NOTE: HSTS is only emitted by the HTTPS (443) server block. Never send it from
# the plaintext listener - a browser that receives it over HTTP ignores it, and
# sending it from a host you do not fully control (the *.onrender.com /
# *.vercel.app shared domains) would be pointless; see docs/SECURITY-HEADERS.md.
# =============================================================================

add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; script-src-elem 'self'; script-src-attr 'none'; style-src 'self'; style-src-elem 'self'; style-src-attr 'none'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://worker-payment-details.onrender.com; media-src 'none'; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; child-src 'none'; upgrade-insecure-requests" always;

# Two years + includeSubDomains. Add "; preload" ONLY after meeting every
# prerequisite and owning the apex domain (see docs/SECURITY-HEADERS.md).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;

# Kept alongside frame-ancestors 'none' for browsers that predate CSP level 2.
add_header X-Frame-Options "DENY" always;

add_header Referrer-Policy "no-referrer, strict-origin-when-cross-origin" always;

add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), clipboard-read=(), clipboard-write=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), speaker-selection=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()" always;

add_header Origin-Agent-Cluster "?1" always;
add_header X-DNS-Prefetch-Control "off" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-Download-Options "noopen" always;

# Legacy XSS auditor disabled: the filter itself has been used for information
# disclosure and is removed from every current browser.
add_header X-XSS-Protection "0" always;
