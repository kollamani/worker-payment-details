# =============================================================================
# Financial Ledger - hardened nginx reverse proxy (SPA + API on one host)
# =============================================================================
# Deploy to:  /etc/nginx/conf.d/financial-ledger.conf
# Include from the http{} context:   include /etc/nginx/conf.d/financial-ledger.conf;
#
# Assumes:
#   /var/www/financial-ledger/dist      -> `npm run build` output (frontend/dist)
#   http://127.0.0.1:5000               -> the Node/Express API (backend/server.js)
#   security-headers.conf               -> this repo's deploy/nginx/security-headers.conf
#
# Replace the two server_name/certificate placeholders before use.
# =============================================================================

# --- plaintext listener: redirect everything, emit NO security headers -------
server {
    listen      80;
    listen      [::]:80;
    server_name worker-payment-details.example.com;

    # Redirects are the only response this block produces. HSTS must never be
    # advertised here (see the TLS block below).
    return 301 https://$host$request_uri;
}

# --- TLS listener: the only place where the hardened policy is applied ------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name worker-payment-details.example.com;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    # Request size ceiling - matches the Express JSON body limit (100kb) with
    # headroom for the few multipart-free endpoints that exist today.
    client_max_body_size 1m;

    # --- TLS -----------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/worker-payment-details.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worker-payment-details.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling (needs a resolver in the http{} block, e.g.
    # resolver 1.1.1.1 8.8.8.8 valid=300s; resolver_timeout 5s;)
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Content -------------------------------------------------------------
    root  /var/www/financial-ledger/dist;
    index index.html;

    # Security headers for every response that has no add_header of its own
    # below. Any location that adds a header MUST include the same snippet,
    # otherwise nginx drops the inherited headers for that response.
    include /etc/nginx/snippets/financial-ledger-security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA history fallback: /dashboard, /task-notes, ... all resolve to the shell.
    try_files $uri $uri/ /index.html;

    # Content-hashed bundles - cache hard. The add_header below resets inherited
    # headers, so the security snippet is included again on purpose.
    location /assets/ {
        include /etc/nginx/snippets/financial-ledger-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The shell itself must be revalidated so a deploy is visible immediately.
    location = /index.html {
        include /etc/nginx/snippets/financial-ledger-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Service worker / manifest must never be cached long-term either.
    location ~* \.(?:webmanifest|json)$ {
        include /etc/nginx/snippets/financial-ledger-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # --- API proxy -----------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Required for Express `trust proxy` so req.secure / req.ip are correct.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;

        # Defence in depth: strip framework disclosure even if the app regresses.
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Render-Origin-Server;
        proxy_hide_header Server;

        # The API sends `Cache-Control: no-store` itself; the inherited security
        # headers apply here because this location adds no header of its own.
    }

    # Optional: brute-force protection for the auth endpoints. Define the zone in
    # the http{} block first (limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;)
    # and then uncomment in a dedicated location:
    # location = /api/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://127.0.0.1:5000; }
}
